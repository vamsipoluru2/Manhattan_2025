<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Management Flowchart</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            overflow-x: auto;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 28px;
        }
        svg {
            display: block;
            margin: 0 auto;
        }
        .node {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .node:hover rect,
        .node:hover ellipse,
        .node:hover polygon {
            filter: brightness(0.9);
            stroke-width: 3;
        }
        .node text {
            pointer-events: none;
        }
        .arrow {
            transition: all 0.3s ease;
        }
        .node:hover ~ .arrow {
            stroke-width: 3;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .highlight {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏭 Warehouse Management System Flow</h1>
        <svg width="1100" height="1800" viewBox="0 0 1100 1800">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#333" />
                </marker>
                <linearGradient id="startGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="processGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="decisionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="endGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
                </linearGradient>
            </defs>
            
            <!-- Start -->
            <g class="node">
                <ellipse cx="550" cy="50" rx="80" ry="30" fill="url(#startGrad)" stroke="#22c55e" stroke-width="2"/>
                <text x="550" y="55" text-anchor="middle" fill="white" font-weight="bold">Start</text>
            </g>
            
            <!-- Initialize Warehouse -->
            <line x1="550" y1="80" x2="550" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <g class="node">
                <rect x="450" y="120" width="200" height="60" rx="8" fill="url(#processGrad)" stroke="#3b82f6" stroke-width="2"/>
                <text x="550" y="155" text-anchor="middle" fill="white" font-weight="bold">Initialize Warehouse</text>
            </g>
            
            <!-- While Running Loop -->
            <line x1="550" y1="180" x2="550" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <g class="node">
                <polygon points="550,220 650,260 550,300 450,260" fill="url(#decisionGrad)" stroke="#f59e0b" stroke-width="2"/>
                <text x="550" y="265" text-anchor="middle" fill="white" font-weight="bold">Running?</text>
            </g>
            
            <!-- Yes path -->
            <line x1="550" y1="300" x2="550" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <text x="570" y="325" fill="#22c55e" font-weight="bold">yes</text>
            
            <!-- Display Menu -->
            <g class="node">
                <rect x="450" y="340" width="200" height="60" rx="8" fill="url(#processGrad)" stroke="#3b82f6" stroke-width="2"/>
                <text x="550" y="375" text-anchor="middle" fill="white" font-weight="bold">Display Menu</text>
            </g>
            
            <!-- Get User Choice -->
            <line x1="550" y1="400" x2="550" y2="440" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <g class="node">
                <rect x="450" y="440" width="200" height="60" rx="8" fill="url(#processGrad)" stroke="#3b82f6" stroke-width="2"/>
                <text x="550" y="475" text-anchor="middle" fill="white" font-weight="bold">Get User Choice</text>
            </g>
            
            <!-- Switch Decision -->
            <line x1="550" y1="500" x2="550" y2="540" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <g class="node">
                <polygon points="550,540 680,590 550,640 420,590" fill="url(#decisionGrad)" stroke="#f59e0b" stroke-width="2"/>
                <text x="550" y="595" text-anchor="middle" fill="white" font-weight="bold">Menu Choice</text>
            </g>
            
            <!-- Case 1: View Inventory (Left) -->
            <line x1="420" y1="590" x2="150" y2="590" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <text x="280" y="585" fill="#8b5cf6" font-weight="bold">1: View</text>
            <g class="node">
                <rect x="50" y="700" width="200" height="50" rx="8" fill="url(#processGrad)" stroke="#3b82f6" stroke-width="2"/>
                <text x="150" y="720" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Get Inventory</text>
                <text x="150" y="735" text-anchor="middle" fill="white" font-size="12" font-weight="bold">& Print Items</text>
            </g>
            <line x1="150" y1="590" x2="150" y2="700" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            
            <!-- Case 2: Place Order -->
            <line x1="420" y1="590" x2="350" y2="650" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <text x="370" y="615" fill="#8b5cf6" font-weight="bold">2: Order</text>
            <g class="node">
                <rect x="250" y="650" width="200" height="60" rx="8" fill="url(#processGrad)" stroke="#3b82f6" stroke-width="2"/>
                <text x="350" y="675" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Prompt for Item,</text>
                <text x="350" y="690" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Qty, Address</text>
            </g>
            <line x1="350" y1="710" x2="350" y2="750" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <g class="node">
                <polygon points="350,750 430,790 350,830 270,790" fill="url(#decisionGrad)" stroke="#f59e0b" stroke-width="2"/>
                <text x="350" y="795" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Available?</text>
            </g>
            <!-- Yes branch -->
            <line x1="350" y1="830" x2="350" y2="880" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <text x="365" y="860" fill="#22c55e" font-size="12" font-weight="bold">yes</text>
            <g class="node">
                <rect x="250" y="880" width="200" height="60" rx="8" fill="url(#processGrad)" stroke="#3b82f6" stroke-width="2"/>
                <text x="350" y="905" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Update Inventory,</text>
                <text x="350" y="920" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Create & Print Order</text>
            </g>
            <!-- No branch -->
            <line x1="270" y1="790" x2="200" y2="790" x2="200" y2="900" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <text x="220" y="785" fill="#ef4444" font-size="12" font-weight="bold">no</text>
            <g class="node">
                <rect x="100" y="900" width="100" height="40" rx="8" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
                <text x="150" y="925" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Error</text>
            </g>
            
            <!-- Case 3: Update Stock (Center) -->
            <line x1="550" y1="640" x2="550" y2="700" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <text x="565" y="670" fill="#8b5cf6" font-weight="bold">3: Stock</text>
            <g class="node">
                <rect x="450" y="700" width="200" height="60" rx="8" fill="url(#processGrad)" stroke="#3b82f6" stroke-width="2"/>
                <text x="550" y="725" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Prompt for Item</text>
                <text x="550" y="740" text-anchor="middle" fill="white" font-size="12" font-weight="bold">& Qty to Add</text>
            </g>
            <line x1="550" y1="760" x2="550" y2="800" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <g class="node">
                <polygon points="550,800 630,840 550,880 470,840" fill="url(#decisionGrad)" stroke="#f59e0b" stroke-width="2"/>
                <text x="550" y="845" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Exists?</text>
            </g>
            <!-- Yes -->
            <line x1="550" y1="880" x2="550" y2="930" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <text x="565" y="910" fill="#22c55e" font-size="12" font-weight="bold">yes</text>
            <g class="node">
                <rect x="450" y="930" width="200" height="50" rx="8" fill="url(#processGrad)" stroke="#3b82f6" stroke-width="2"/>
                <text x="550" y="950" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Update Qty</text>
                <text x="550" y="965" text-anchor="middle" fill="white" font-size="12" font-weight="bold">& Print Success</text>
            </g>
            <!-- No -->
            <line x1="470" y1="840" x2="400" y2="840" x2="400" y2="945" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <text x="420" y="835" fill="#ef4444" font-size="12" font-weight="bold">no</text>
            <g class="node">
                <rect x="350" y="945" width="50" height="40" rx="8" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
                <text x="375" y="970" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Err</text>
            </g>
            
            <!-- Case 4: Process Delivery (Right) -->
            <line x1="680" y1="590" x2="750" y2="650" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <text x="700" y="615" fill="#8b5cf6" font-weight="bold">4: Deliver</text>
            <g class="node">
                <rect x="650" y="650" width="200" height="60" rx="8" fill="url(#processGrad)" stroke="#3b82f6" stroke-width="2"/>
                <text x="750" y="675" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Prompt Order ID</text>
                <text x="750" y="690" text-anchor="middle" fill="white" font-size="12" font-weight="bold">& New Status</text>
            </g>
            <line x1="750" y1="710" x2="750" y2="750" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <g class="node">
                <polygon points="750,750 830,790 750,830 670,790" fill="url(#decisionGrad)" stroke="#f59e0b" stroke-width="2"/>
                <text x="750" y="795" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Exists?</text>
            </g>
            <!-- Yes -->
            <line x1="750" y1="830" x2="750" y2="880" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <text x="765" y="860" fill="#22c55e" font-size="12" font-weight="bold">yes</text>
            <g class="node">
                <rect x="650" y="880" width="200" height="50" rx="8" fill="url(#processGrad)" stroke="#3b82f6" stroke-width="2"/>
                <text x="750" y="900" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Update Status</text>
                <text x="750" y="915" text-anchor="middle" fill="white" font-size="12" font-weight="bold">& Print Success</text>
            </g>
            <!-- No -->
            <line x1="830" y1="790" x2="900" y2="790" x2="900" y2="895" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <text x="850" y="785" fill="#ef4444" font-size="12" font-weight="bold">no</text>
            <g class="node">
                <rect x="875" y="895" width="50" height="40" rx="8" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
                <text x="900" y="920" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Err</text>
            </g>
            
            <!-- Case 5: Generate Report (Far Right) -->
            <line x1="680" y1="590" x2="950" y2="590" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <text x="800" y="585" fill="#8b5cf6" font-weight="bold">5: Report</text>
            <g class="node">
                <rect x="850" y="700" width="200" height="50" rx="8" fill="url(#processGrad)" stroke="#3b82f6" stroke-width="2"/>
                <text x="950" y="720" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Generate Report</text>
                <text x="950" y="735" text-anchor="middle" fill="white" font-size="12" font-weight="bold">& Print</text>
            </g>
            <line x1="950" y1="590" x2="950" y2="700" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            
            <!-- Case 6: Exit -->
            <line x1="680" y1="590" x2="1000" y2="590" x2="1000" y2="1100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <text x="1010" y="585" fill="#ef4444" font-weight="bold">6: Exit</text>
            <g class="node">
                <ellipse cx="1000" cy="1120" rx="60" ry="30" fill="url(#endGrad)" stroke="#ef4444" stroke-width="2"/>
                <text x="1000" y="1125" text-anchor="middle" fill="white" font-weight="bold">Stop</text>
            </g>
            
            <!-- Merge all branches back -->
            <line x1="150" y1="750" x2="150" y2="1050" x2="550" y2="1050" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <line x1="350" y1="940" x2="350" y2="1050" x2="550" y2="1050" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <line x1="550" y1="980" x2="550" y2="1050" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <line x1="750" y1="930" x2="750" y2="1050" x2="550" y2="1050" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <line x1="950" y1="750" x2="950" y2="1050" x2="550" y2="1050" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            
            <!-- Loop back -->
            <line x1="550" y1="1050" x2="550" y2="1100" x2="100" y2="1100" x2="100" y2="260" x2="450" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            
            <!-- No exit path -->
            <line x1="450" y1="260" x2="350" y2="260" x2="350" y2="1150" x2="1000" y2="1150" x2="1000" y2="1090" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" class="arrow"/>
            <text x="365" y="255" fill="#ef4444" font-weight="bold">no</text>
        </svg>
    </div>
</body>
</html>
