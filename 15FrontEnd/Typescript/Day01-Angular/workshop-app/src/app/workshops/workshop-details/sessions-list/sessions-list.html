<h2>List of sessions</h2>

<hr />

@if(loading) {
    <app-loader-spinner variant="success"></app-loader-spinner>
} @else if( !loading && error ) {
    <!--
        parent gets hold o the new page and calls its own changePage()
    -->
    <app-error-alert [err]="error"></app-error-alert>
} @else {
    <ul class="list-group">
        @for( s of sessions; track s.id ) {
            <li class="list-group-item">
                <div class="row">
<div class="col-1 d-flex flex-column justify-content-center align-items-center">
<app-voting-widget [votes]="s.upvoteCount" (vote)="updateVote(s, $event)"></app-voting-widget>
</div>
<div class="col-11">
<app-item [session]="s" />
</div>
</div>
 
            </li>

            <div
    class="col-1 d-flex flex-column justify-content-center align-items-center"
>
    <!-- <app-voting-widget
        [votes]="s.upvoteCount"
        (vote)="updateVote(s, $event)"
    ></app-voting-widget> -->
</div>
        }
    </ul>
}
